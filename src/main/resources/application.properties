spring.application.name=KeremMusic
server.port=9092

# Veritabanı
spring.datasource.url=jdbc:h2:mem:keremmusicdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Konsolu
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true
spring.h2.console.settings.frame-options=disable
# H2 Konsolunun hata vermemesi için şu satırı mevcut ayarlarına ekle

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Güvenlik
management.endpoints.web.exposure.include=*